/* مناطق التفاعل فوق الصورة — الشكل الأصلي لا يتغير */
.hit{
  position:absolute;
  border:0;
  outline:0;
  background:transparent;
  color:transparent;
  font:inherit;
  z-index:5;
}
.hit::placeholder{color:transparent}
.email{left:20.2%;top:40.5%;width:59%;height:6.4%;padding:0 70px 0 55px}
.password{left:20.2%;top:49.2%;width:59%;height:6.4%;padding:0 70px 0 55px}
.login{left:20.2%;top:59.0%;width:59%;height:6.4%;cursor:pointer}
.eye{right:20.3%;top:50.0%;width:8%;height:4.8%;cursor:pointer}
.remember{right:18.0%;top:67.0%;width:10%;height:5%;cursor:pointer}
.toast{
  position:fixed;z-index:20;top:18px;left:50%;
  transform:translate(-50%,-90px);
  background:rgba(12,67,106,.95);color:white;
  padding:12px 20px;border-radius:12px;
  font-family:Tahoma,Arial,sans-serif;font-size:16px;
  transition:.25s;direction:rtl
}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="screen" aria-label="واجهة تسجيل الدخول">
  <input class="hit email" id="email" type="email" autocomplete="username" aria-label="البريد الإلكتروني">
  <input class="hit password" id="password" type="password" autocomplete="current-password" aria-label="كلمة المرور">
  <button class="hit eye" id="eye" type="button" aria-label="إظهار كلمة المرور"></button>
  <button class="hit login" id="login" type="button" aria-label="دخول"></button>
  <button class="hit remember" id="remember" type="button" aria-label="تذكّرني"></button>
</div>
<div class="toast" id="toast"></div>
<script>
const password=document.getElementById('password');
document.getElementById('eye').onclick=()=>{
  password.type=password.type==='password'?'text':'password';
};
document.getElementById('login').onclick=()=>{
  const t=document.getElementById('toast');
  if(!document.getElementById('email').value.trim() || !password.value.trim())
    t.textContent='يرجى إدخال البريد الإلكتروني وكلمة المرور';
  else
    t.textContent='تم تسجيل الدخول بنجاح';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
};
document.getElementById('remember').onclick=()=>{
  const t=document.getElementById('toast');
  t.textContent='تم تغيير خيار تذكّرني';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1200);
};
</script>
</body>
</html>
