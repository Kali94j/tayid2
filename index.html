<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول - برنامج تأييد الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#123b7a;--muted:#4a5a75;--page:#a9d3f2;--page2:#a89583;--blue:#0a62f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#3b6f9c;--page2:#5d4f43}}
:root[data-theme="dark"]{--page:#3b6f9c;--page2:#5d4f43}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(var(--page),var(--page2));font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100vw,calc(100dvh*2/3));aspect-ratio:2/3;container-type:inline-size;overflow:hidden}
.stage{background:var(--bg) center/100% 100% no-repeat}
body::before{content:'';position:fixed;inset:-30px;background:var(--bg) center/cover;filter:blur(20px);z-index:-1}
.panel{position:absolute;left:16%;top:11.85%;width:68%;height:77%;border-radius:6.5cqw;overflow:hidden;
background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(235,246,255,.4));
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:.4cqw solid rgba(255,255,255,.9);
box-shadow:0 3cqw 8cqw rgba(20,60,120,.25);display:flex;flex-direction:column;align-items:center;padding-top:3cqw}
.logo{width:20cqw;height:20cqw;border-radius:50%;border:.3cqw solid rgba(255,255,255,.8);padding:1.2cqw;background:rgba(255,255,255,.35)}
.logo div{width:100%;height:100%;border-radius:50%;background:linear-gradient(150deg,#0a3fb0,#0a7fd0 55%,#10c8b6);display:grid;place-items:center}
.logo svg{width:66%;height:66%}
h1{font-size:5.6cqw;font-weight:800;color:var(--ink);margin-top:2cqw;line-height:1.3}
.sub{font-size:2.6cqw;color:var(--muted);margin-top:.8cqw}
.bar{width:10cqw;height:1cqw;border-radius:1cqw;background:linear-gradient(90deg,#10d0c0,#0a4fd6);margin:3cqw 0 4cqw}
.field{width:86.6%;height:9.8cqw;border-radius:2.6cqw;background:rgba(255,255,255,.58);border:.2cqw solid rgba(255,255,255,.95);
margin-bottom:3.8cqw;display:flex;direction:ltr;align-items:center;padding:0 3cqw;gap:2.6cqw;box-shadow:0 .6cqw 2cqw rgba(30,80,150,.08)}
.field svg{width:4.4cqw;height:4.4cqw;flex:none;color:#1b3f7c}
.field input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;font:500 2.5cqw 'Tajawal',sans-serif;color:var(--ink);text-align:left}
.field input::placeholder{color:#5a6b86}
.field:focus-within{border-color:#0a62f0;box-shadow:0 0 0 .5cqw rgba(10,98,240,.25)}
.eye{border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;color:#1b3f7c}
.eye .off{display:none}.eye.show .on{display:none}.eye.show .off{display:block}
.go{width:86.6%;height:9.8cqw;border-radius:2.6cqw;border:.2cqw solid rgba(255,255,255,.7);cursor:pointer;direction:ltr;
background:linear-gradient(100deg,#08d6ba,#0a8ae0 45%,#0a42cf);color:#fff;font:700 3.8cqw 'Tajawal',sans-serif;
display:flex;align-items:center;justify-content:center;gap:2.6cqw;box-shadow:0 1.4cqw 3cqw rgba(10,80,220,.35)}
.go svg{width:4.6cqw;height:4.6cqw}
.go:active{transform:translateY(.3cqw)}
.rem{width:86.6%;margin-top:4cqw;display:flex;align-items:center;gap:1.8cqw}
.sw{width:7.4cqw;height:4.4cqw;border-radius:4cqw;border:0;background:#aab8cc;position:relative;cursor:pointer;direction:ltr;transition:background .2s}
.sw i{position:absolute;top:.4cqw;left:.4cqw;width:3.6cqw;height:3.6cqw;border-radius:50%;background:#fff;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked=true]{background:var(--blue)}.sw[aria-checked=true] i{left:3.4cqw}
.rem span{font-size:2.7cqw;font-weight:500;color:var(--ink)}
.wave{position:absolute;left:0;bottom:0;width:100%;height:14cqw}
.leaf{position:absolute;left:0;bottom:5cqw;width:12cqw}
.tag{position:absolute;left:0;right:0;bottom:11.4cqw;display:flex;justify-content:center;align-items:center;gap:2.2cqw;font-size:2.6cqw;font-weight:500;color:var(--ink)}
.tag:before,.tag:after{content:"";width:5cqw;height:.2cqw;background:#1b3f7c;opacity:.6}
.toast{position:absolute;top:3cqw;left:50%;transform:translateX(-50%);background:rgba(18,59,122,.92);color:#fff;font-size:2.6cqw;padding:1.4cqw 3cqw;border-radius:3cqw;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.on{opacity:1}
</style>

$('eye').onclick=function(){var p=$('pass'),s=p.type==='password';p.type=s?'text':'password';this.classList.toggle('show',s)};
$('sw').onclick=function(){this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')};

$('go').onclick=function(){
